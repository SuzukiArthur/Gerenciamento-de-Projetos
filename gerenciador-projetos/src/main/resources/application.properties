spring.application.name=gerenciador-projetos

spring.datasource.url=${DB_URL:jdbc:h2:mem:gerenciador_projetos;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

#aviso
spring.jpa.open-in-view=true 

# URL do Swagger com http://localhost:8080

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha


# Configurações do JWT
jwt.secret=${JWT_SECRET:uma-chave-com-mais-de-32-caracteres-aqui}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
